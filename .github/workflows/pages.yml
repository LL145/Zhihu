name: pages

# 网页试用版（web/）：静态页 + Pyodide 在浏览器内跑完整管线。
# 站点自带 tianwen 包（git archive，只含入库文件）与 cnlunar wheel，
# 页面加载除 Pyodide CDN 与 OpenRouter 外不依赖任何外部源。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 组装站点（页面 + tianwen 包 + 依赖 wheel）
        run: |
          mkdir -p _site/wheels
          cp web/* _site/
          git archive HEAD tianwen -o _site/tianwen.zip
          pip download cnlunar==0.2.4 --no-deps -d _site/wheels

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
