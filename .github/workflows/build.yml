name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write # 打 tag 时发布 Release 需要
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          pip install -r requirements-dev.txt
          pip install pyinstaller

      - name: 运行测试
        run: python -m pytest tests/ -q

      - name: 打包单文件可执行（命令行版 + 界面版）
        run: |
          pyinstaller --onefile --name tianwen --add-data "tianwen/data;tianwen/data" run.py
          pyinstaller --onefile --windowed --name tianwen-gui --add-data "tianwen/data;tianwen/data" run_gui.py

      - name: 冒烟测试（无 LLM 模式）
        run: |
          ./dist/tianwen.exe -q "test question" --when "2026-08-24 15:30" --no-llm
          ./dist/tianwen.exe -q "我今年运势如何" --birth 2000-09-14 --birth-time 午 --gender 男 --when "2026-08-24 15:30" --no-llm
          python -c "import tianwen.gui"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: tianwen-windows
          path: |
            dist/tianwen.exe
            dist/tianwen-gui.exe

      - name: 发布 Release（仅 v* 标签）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tianwen.exe
            dist/tianwen-gui.exe
          generate_release_notes: true
